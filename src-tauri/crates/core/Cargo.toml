[package]
name = "blitzscript-core"
version = "0.1.0"
description = "Pure-Rust core for blitzscript: discovery, the derived SQLite cache, and the operator-error heuristic. No GUI/Tauri dependency, so it is fast to test in isolation."
edition = "2021"
rust-version = "1.77"

[lib]
name = "blitzscript_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
walkdir = "2"
once_cell = "1"
